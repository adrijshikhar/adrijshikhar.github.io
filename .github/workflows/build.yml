name: Build

on:
  pull_request:
    branches: [content]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify sky invariants
        run: bun run verify:sky
      - name: Verify code theme contrast
        run: bun run verify:code


      - name: Build
        run: bun run build
