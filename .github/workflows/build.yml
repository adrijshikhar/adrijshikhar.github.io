name: Build

on:
  pull_request:
    branches: [content]
  push:
    branches: [content, 'feat/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup fnm
        uses: Schniz/fnm-action@v1.5.0

      - name: Install Node
        run: |
          fnm install
          fnm use
          node --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
